{% from '_macros.html' import csrf %}{% extends 'base.html' %}{% block body %}<div class="card" style="max-width:460px"><h2>Change password</h2><div class="cb">
<form method="post">{{ csrf() }}<div class="fld"><label>Current password</label><input type="password" name="current" required autocomplete="current-password"></div>
<div class="fld"><label>New password</label><input type="password" name="password" required autocomplete="new-password"><div class="help">At least 10 characters with upper case, lower case and a number.</div></div>
<div class="fld"><label>Repeat new password</label><input type="password" name="password2" required autocomplete="new-password"></div><button class="btn">Update password</button></form></div></div>{% endblock %}
